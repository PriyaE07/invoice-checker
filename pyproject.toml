[project]
name = "invoice-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PriyaE07", email = "eturi001@umn.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.14.4",
]

[project.scripts]
invoice-checker = "invoice_checker:main"
generate-data = "invoice_checker.generator:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.63.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W = PEP 8 style, F = real bugs (unused imports, undefined names),
# I = import sorting, B = common bug patterns, UP = modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]
