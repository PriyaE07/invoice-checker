[project]
name = "invoice-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PriyaE07", email = "eturi001@umn.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.14.4",
]

[project.scripts]
